name: TestSigma Blast Radius Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-blast-radius:
    runs-on: ubuntu-latest

    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures git history is present for git diff checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install neo4j pytest playwright
          playwright install --with-deps

      - name: Execute Blast Radius Engine
        run: |
          python TestSigma_App.py

      - name: Upload HTML Execution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blast-radius-report
          path: latest_report.html
