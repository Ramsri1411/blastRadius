name: TestSigma Autonomous Blast Radius

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  blast-radius-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install neo4j pytest playwright
          playwright install chromium

      - name: Run TestSigma Blast Radius Engine
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python crawler.py
          python TestSigma_App.py

      - name: Upload Blast Radius HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blast-radius-report
          path: latest_report.html

      - name: PR Summary Comment
        if: always()
        run: |
          echo "## 🚀 TestSigma Blast Radius Analysis" >> $GITHUB_STEP_SUMMARY
          echo "Run completed. Download the 'blast-radius-report' artifact to view impacted workflows and test execution results." >> $GITHUB_STEP_SUMMARY